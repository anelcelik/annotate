name: Build Windows Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish GitHub Releases on tag push

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Source ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CPU-only PyTorch (must come before requirements.txt)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install UPX (binary compressor)
        run: choco install upx --no-progress -y

      # ── Assets ──────────────────────────────────────────────────────────────
      - name: Generate icons
        run: python create_icons.py

      # ── Executable ──────────────────────────────────────────────────────────
      - name: Build executable with PyInstaller
        run: pyinstaller annotate.spec

      # ── MSI (WiX 4) ─────────────────────────────────────────────────────────
      - name: Install WiX 4 + extensions
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add --global WixToolset.UI.wixext/4.0.5

      - name: Harvest _internal folder into WiX fragment
        run: >
          wix harvest dir dist\ScreenAnnotatorPro\_internal
          -o installer\AppFiles.wxs
          -cg AppFiles
          -dr InternalFolder
          -srd
          -var var.SourceDir

      - name: Build MSI
        run: >
          wix build installer\annotate.wxs installer\AppFiles.wxs
          -ext WixToolset.UI.wixext
          -arch x64
          -o dist\ScreenAnnotatorPro-Setup.msi
          -d SourceDir=dist\ScreenAnnotatorPro\_internal

      # ── MSIX ────────────────────────────────────────────────────────────────
      - name: Stage MSIX content
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path msix_staging/Assets -Force | Out-Null
          Copy-Item dist\ScreenAnnotatorPro\ScreenAnnotatorPro.exe msix_staging\
          Copy-Item installer\AppxManifest.xml  msix_staging\
          Copy-Item icons\*.png                 msix_staging\Assets\

      - name: Locate Windows SDK tools
        id: sdk
        shell: pwsh
        run: |
          $base = "C:\Program Files (x86)\Windows Kits\10\bin"
          $pick = { param($n)
            Get-ChildItem $base -Recurse -Filter $n |
              Where-Object { $_.FullName -match "x64" } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          "makeappx=$( &$pick makeappx.exe )" >> $env:GITHUB_OUTPUT
          "signtool=$(  &$pick signtool.exe  )" >> $env:GITHUB_OUTPUT

      - name: Pack MSIX
        shell: pwsh
        run: |
          & "${{ steps.sdk.outputs.makeappx }}" pack /d msix_staging /p dist\ScreenAnnotatorPro.msix /nv

      - name: Sign MSIX with a self-signed development certificate
        shell: pwsh
        run: |
          # Subject must match Publisher in AppxManifest.xml exactly.
          # When submitting to the Microsoft Store, upload the UNSIGNED .msix —
          # Partner Center re-signs it with the Casultra certificate automatically.
          # This self-signed cert is only needed for local sideload testing.
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=BD1D6788-5A7D-4A7F-9751-817381E6C28C" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Screen Annotator Pro Dev Cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString "SAPDevCert!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath dist\dev.pfx -Password $pwd | Out-Null
          & "${{ steps.sdk.outputs.signtool }}" sign /fd SHA256 /f dist\dev.pfx /p "SAPDevCert!" dist\ScreenAnnotatorPro.msix
          Write-Host "::notice::MSIX signed with self-signed cert (CN=BD1D6788-5A7D-4A7F-9751-817381E6C28C)"

      # ── Artifacts ───────────────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAnnotatorPro-Windows-Installers
          path: |
            dist/ScreenAnnotatorPro-Setup.msi
            dist/ScreenAnnotatorPro.msix
          retention-days: 30

      # Publish to GitHub Releases when a tag like v1.2.3 is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ScreenAnnotatorPro-Setup.msi
            dist/ScreenAnnotatorPro.msix
          generate_release_notes: true
