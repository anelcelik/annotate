name: Build Windows Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish GitHub Releases on tag push

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Source ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      # ── Assets ──────────────────────────────────────────────────────────────
      - name: Generate icons
        run: python create_icons.py

      # ── Executable ──────────────────────────────────────────────────────────
      - name: Build executable with PyInstaller
        run: pyinstaller annotate.spec

      # ── MSI (WiX 4) ─────────────────────────────────────────────────────────
      - name: Install WiX 4 + UI extension
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add --global WixToolset.UI.wixext/4.0.5

      - name: Build MSI
        run: wix build installer/annotate.wxs -ext WixToolset.UI.wixext -arch x64 -o dist/Annotate-Setup.msi

      # ── MSIX ────────────────────────────────────────────────────────────────
      - name: Stage MSIX content
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path msix_staging/Assets -Force | Out-Null
          Copy-Item dist\Annotate.exe       msix_staging\
          Copy-Item installer\AppxManifest.xml msix_staging\
          Copy-Item icons\*.png             msix_staging\Assets\

      - name: Locate Windows SDK tools
        id: sdk
        shell: pwsh
        run: |
          $base = "C:\Program Files (x86)\Windows Kits\10\bin"
          $pick = { param($n)
            Get-ChildItem $base -Recurse -Filter $n |
              Where-Object { $_.FullName -match "x64" } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          "makeappx=$( &$pick makeappx.exe )" >> $env:GITHUB_OUTPUT
          "signtool=$(  &$pick signtool.exe  )" >> $env:GITHUB_OUTPUT

      - name: Pack MSIX
        shell: pwsh
        run: |
          & "${{ steps.sdk.outputs.makeappx }}" pack /d msix_staging /p dist\Annotate.msix /nv

      - name: Sign MSIX with a self-signed development certificate
        shell: pwsh
        run: |
          # Publisher in AppxManifest.xml must match the cert Subject exactly.
          # For Microsoft Store submission replace this with your Partner Center
          # Publisher value and a real code-signing certificate stored as a secret.
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Annotate" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Annotate Dev Cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString "AnnotateDevCert!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath dist\dev.pfx -Password $pwd | Out-Null
          & "${{ steps.sdk.outputs.signtool }}" sign /fd SHA256 /f dist\dev.pfx /p "AnnotateDevCert!" dist\Annotate.msix
          Write-Host "::notice::MSIX signed with self-signed cert (CN=Annotate)"

      # ── Artifacts ───────────────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Annotate-Windows-Installers
          path: |
            dist/Annotate-Setup.msi
            dist/Annotate.msix
          retention-days: 30

      # Publish to GitHub Releases when a tag like v1.2.3 is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Annotate-Setup.msi
            dist/Annotate.msix
          generate_release_notes: true
