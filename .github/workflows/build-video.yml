name: Build single-file Windows EXE (video)

# Produces ONE .exe that runs on a Windows machine with no Python, no Qt and
# no ffmpeg installed — download it, double-click it, done.
#
# One build since 5.2: Snip & Read runs on the OCR engine built into Windows,
# so the old "full" variant (EasyOCR + Torch, ~300 MB) is gone. ANNOTATE_LITE=1
# still means "no EasyOCR/Torch/Pillow in the bundle".
#
# What gets kept, and where:
#   every push   builds and self-tests everything, keeps nothing. Artifact
#                storage has a quota, and one run used to upload ~620 MB —
#                two pushes in a month were enough to turn CI red.
#   Run workflow (workflow_dispatch) → every build as an artifact, 5 days
#   v* tag       → everything on the GitHub Release: the portable .exe,
#                  the .msi, the sideload .msix (+ .cer) and the unsigned
#                  Store-submission .msix. Releases don't count against the
#                  artifact quota, so a full quota can't block a release.

on:
  push:
    branches: [main, video-recording]
    tags: ['v*']
    # No `paths:` filter here on purpose: GitHub applies one `paths` list to
    # the whole push trigger, branches and tags alike, and there's no
    # well-defined "previous ref" to diff a new tag against — a v* push can
    # silently build nothing if paths is set. main is annotateVideo/ almost
    # entirely now, so an occasional rebuild on an unrelated root-level
    # commit is a small price for a release tag that reliably fires.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish/attach to GitHub Releases on tag push

env:
  # Pinned, checksummed ffmpeg: a stable release rather than a nightly (the
  # BtbN master build used before could change under us on any run), and at
  # 100 MB about 39 MB smaller than it. Has everything the app uses — x264,
  # AAC, VP9 + Opus, GIF palettes, DirectShow — and Media Foundation / AMF /
  # NVENC for hardware encoding later. GPLv3; its LICENSE and README (build
  # config + source link) ship next to the binary. To update: new URL, then
  # the zip's SHA-256.
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
  # Python/WinRT: start-on-boot for the Store package, the Store's in-app
  # rating dialog, and Snip & Read's OCR. Imported lazily; the app runs
  # without them.
  WINRT_PACKAGES: >-
    winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections
    winrt-Windows.ApplicationModel winrt-Windows.ApplicationModel.Activation
    winrt-Windows.Services.Store winrt-Windows.Media.Ocr
    winrt-Windows.Graphics.Imaging winrt-Windows.Storage.Streams
    winrt-Windows.Globalization

jobs:
  # ── Tests on real Windows ───────────────────────────────────────────────────
  # The same suite that runs anywhere, plus what only Windows can check:
  # RegisterHotKey delivering WM_HOTKEY through PyQt6's native event filter,
  # and the WinRT names platform_win.py calls.
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install PyQt6 pynput pytest ${{ env.WINRT_PACKAGES }}
      # The recording tests (GPU command, exports) need the same ffmpeg the
      # app ships.
      - name: Fetch the pinned ffmpeg.exe
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg.zip checksum mismatch" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $exe = Get-ChildItem ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "SCREEN_ANNOTATOR_FFMPEG=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Run the tests
        working-directory: annotateVideo
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -v -rs

  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # ── ffmpeg ──────────────────────────────────────────────────────────────
      # A single-file build has no PATH to fall back on, so the encoder has to
      # travel inside the exe. find_ffmpeg() picks it up from _MEIPASS at run
      # time.
      - name: Fetch the pinned ffmpeg.exe
        shell: pwsh
        run: |
          Write-Host "Downloading $env:FFMPEG_URL"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) {
            throw "ffmpeg.zip checksum mismatch: got $hash, expected $env:FFMPEG_SHA256"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $exe = Get-ChildItem ffmpeg_extract -Recurse -Filter ffmpeg.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in the downloaded archive" }
          $root = $exe.Directory.Parent.FullName
          New-Item -ItemType Directory -Force -Path annotateVideo\vendor | Out-Null
          Copy-Item $exe.FullName annotateVideo\vendor\ffmpeg.exe
          Copy-Item (Join-Path $root 'LICENSE') annotateVideo\vendor\ffmpeg-LICENSE.txt
          Copy-Item (Join-Path $root 'README.txt') annotateVideo\vendor\ffmpeg-README.txt
          "{0:N0} MB  ffmpeg.exe" -f ((Get-Item annotateVideo\vendor\ffmpeg.exe).Length / 1MB)
          & annotateVideo\vendor\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      # ── Python dependencies ─────────────────────────────────────────────────
      # No Pillow here: only the EasyOCR path uses it, and the build must not
      # carry it (create_icons.py draws with Qt).
      - name: Install core dependencies
        run: pip install PyQt6 pynput pyinstaller ${{ env.WINRT_PACKAGES }}

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Generate icons
        working-directory: annotateVideo
        run: python create_icons.py

      - name: Build the single-file executable
        working-directory: annotateVideo
        env:
          ANNOTATE_LITE: '1'
        run: pyinstaller annotate_onefile.spec

      - name: Report what came out
        shell: pwsh
        working-directory: annotateVideo
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  —  {1:N0} MB" -f $_.Name, ($_.Length / 1MB)
          }

      # The spec strips everything it believes unused (build_filters.py). Run
      # the result: a module or DLL it dropped by mistake fails here.
      - name: Self-test the executable
        shell: pwsh
        working-directory: annotateVideo
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter *.exe |
                 Where-Object { $_.Name -like 'ScreenAnnotatorPro*' } |
                 Select-Object -First 1
          $dir = New-Item -ItemType Directory -Force -Path selftest
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' `
                 -WorkingDirectory $dir -Wait -PassThru
          Get-Content (Join-Path $dir 'self-test.log') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Write the read-me that ships beside it
        shell: pwsh
        working-directory: annotateVideo
        run: |
          @'
          Screen Annotator Pro — Video  (single-file build)
          =================================================

          One file. No installer, no Python, no ffmpeg to install — it is all
          inside the .exe. Copy it anywhere and double-click it.

          FIRST LAUNCH
            The exe unpacks itself into a temp folder each time it starts, so
            the first run takes a few seconds. Later runs are quicker while
            the file is still in the disk cache.

          WINDOWS SMARTSCREEN
            This build is not code-signed, so Windows will say "Windows
            protected your PC". Click "More info" then "Run anyway". The
            signed builds are the MSIX/MSI from the main workflow.

          WHERE THINGS GO
            Recordings   %USERPROFILE%\Videos\ScreenAnnotatorPro\
            Settings     %APPDATA%\ScreenAnnotatorPro\settings.json
            Nothing else on the system is touched. To remove it: delete
            the .exe (and those two folders if you want them gone).

          RECORDING
            Ctrl+Alt+R, the Record button on the dock, or the tray icon.
            Snip & Read uses the text recognition built into Windows.
            Stop the same way. The dock and the HUD are excluded from the
            capture on Windows, so they never appear in the video.
          '@ | Set-Content dist\READ-ME-FIRST.txt -Encoding UTF8

      - name: Upload the executable
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true      # a full artifact quota must not fail the run
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAnnotatorPro-Portable
          path: |
            annotateVideo/dist/*.exe
            annotateVideo/dist/READ-ME-FIRST.txt
          retention-days: 5

      - name: Attach to the release on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: annotateVideo/dist/*.exe

  # ── MSIX + MSI ──────────────────────────────────────────────────────────────
  # Both installers come from the one folder build. The MSIX is a proper
  # installed package with the same identity as the Store app, so its unsigned
  # copy is what goes to Partner Center; the MSI is the classic installer for
  # people who want one (Program Files, Start menu, optional desktop shortcut).
  msix:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Fetch the pinned ffmpeg.exe
        shell: pwsh
        run: |
          Write-Host "Downloading $env:FFMPEG_URL"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) {
            throw "ffmpeg.zip checksum mismatch: got $hash, expected $env:FFMPEG_SHA256"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $exe = Get-ChildItem ffmpeg_extract -Recurse -Filter ffmpeg.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in the downloaded archive" }
          $root = $exe.Directory.Parent.FullName
          New-Item -ItemType Directory -Force -Path annotateVideo\vendor | Out-Null
          Copy-Item $exe.FullName annotateVideo\vendor\ffmpeg.exe
          Copy-Item (Join-Path $root 'LICENSE') annotateVideo\vendor\ffmpeg-LICENSE.txt
          Copy-Item (Join-Path $root 'README.txt') annotateVideo\vendor\ffmpeg-README.txt
          "{0:N0} MB  ffmpeg.exe" -f ((Get-Item annotateVideo\vendor\ffmpeg.exe).Length / 1MB)
          & annotateVideo\vendor\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Install dependencies
        run: pip install PyQt6 pynput pyinstaller ${{ env.WINRT_PACKAGES }}

      - name: Generate icons
        working-directory: annotateVideo
        run: python create_icons.py

      # The folder build, not the single file: MSIX needs real files on disk,
      # and an installed package has no reason to unpack itself at every launch.
      - name: Build the app
        working-directory: annotateVideo
        env:
          ANNOTATE_LITE: '1'
        run: pyinstaller annotate.spec

      - name: Self-test the build
        shell: pwsh
        working-directory: annotateVideo
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter *.exe |
                 Where-Object { $_.Name -like 'ScreenAnnotatorPro*' } |
                 Select-Object -First 1
          $dir = New-Item -ItemType Directory -Force -Path selftest
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' `
                 -WorkingDirectory $dir -Wait -PassThru
          Get-Content (Join-Path $dir 'self-test.log') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      # ── MSI (WiX 4) ───────────────────────────────────────────────────────────
      - name: Install WiX 4
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add --global WixToolset.UI.wixext/4.0.5

      - name: Build the MSI
        shell: pwsh
        working-directory: annotateVideo
        run: |
          $m = Select-String -Path annotate.py -Pattern '^VERSION = "([^"]+)"'
          $version = $m.Matches[0].Groups[1].Value
          Write-Host "Version $version"
          # One component per file under _internal (WiX 4 has no heat).
          $sourceDir = Resolve-Path "dist\ScreenAnnotatorPro\_internal"
          $lines = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">',
            '  <Fragment>',
            '    <ComponentGroup Id="AppFiles" Directory="InternalFolder">'
          )
          Get-ChildItem -Path $sourceDir -Recurse -File | ForEach-Object {
            $rel    = $_.FullName.Substring($sourceDir.Path.Length + 1)
            $subdir = Split-Path $rel -Parent
            $src    = "`$(var.SourceDir)\$rel"
            $attrs  = if ($subdir) { "Guid=""*"" Subdirectory=""$subdir""" } else { 'Guid="*"' }
            $lines += "      <Component $attrs>"
            $lines += "        <File Source=""$src"" />"
            $lines += "      </Component>"
          }
          $lines += '    </ComponentGroup>'
          $lines += '  </Fragment>'
          $lines += '</Wix>'
          $lines -join "`r`n" | Set-Content installer\AppFiles.wxs -Encoding UTF8
          wix build installer\annotate.wxs installer\AppFiles.wxs `
            -ext WixToolset.UI.wixext -arch x64 `
            -d SourceDir=dist\ScreenAnnotatorPro\_internal -d Version=$version `
            -o dist\ScreenAnnotatorPro-Setup.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          "{0:N1} MB  msi" -f ((Get-Item dist\ScreenAnnotatorPro-Setup.msi).Length / 1MB)

      - name: Report the package size by component
        shell: pwsh
        working-directory: annotateVideo
        run: |
          $root = "dist\ScreenAnnotatorPro"
          "{0:N1} MB  installed total" -f ((Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem $root -Recurse -File | Sort-Object Length -Descending |
            Select-Object -First 12 | ForEach-Object {
              "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path $root).Path.Length)
            }

      - name: Stage the package contents
        shell: pwsh
        working-directory: annotateVideo
        run: |
          New-Item -ItemType Directory -Path msix_staging/Assets -Force | Out-Null
          Copy-Item dist\ScreenAnnotatorPro\ScreenAnnotatorPro.exe msix_staging\
          # PyInstaller 6+ puts every DLL and module in _internal
          Copy-Item dist\ScreenAnnotatorPro\_internal msix_staging\_internal -Recurse
          Copy-Item installer\AppxManifest.xml msix_staging\
          Copy-Item icons\*.png msix_staging\Assets\

      - name: Locate the Windows SDK tools
        id: sdk
        shell: pwsh
        run: |
          $base = "C:\Program Files (x86)\Windows Kits\10\bin"
          $pick = { param($n)
            Get-ChildItem $base -Recurse -Filter $n |
              Where-Object { $_.FullName -match "x64" } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          "makeappx=$( &$pick makeappx.exe )" >> $env:GITHUB_OUTPUT
          "signtool=$(  &$pick signtool.exe  )" >> $env:GITHUB_OUTPUT

      - name: Pack the MSIX
        shell: pwsh
        working-directory: annotateVideo
        run: |
          & "${{ steps.sdk.outputs.makeappx }}" pack /d msix_staging `
            /p dist\ScreenAnnotatorProVideo.msix /nv
          "{0:N1} MB  msix (what the Store download is, near enough)" -f ((Get-Item dist\ScreenAnnotatorProVideo.msix).Length / 1MB)

      # Keep an unsigned copy before CI's throwaway cert touches it — this is
      # the one to upload to Partner Center for an actual Store submission;
      # it re-signs with the real Casultra cert itself and will reject
      # anything pre-signed with something else.
      - name: Set aside an unsigned copy for Partner Center
        shell: pwsh
        working-directory: annotateVideo
        run: Copy-Item dist\ScreenAnnotatorProVideo.msix dist\ScreenAnnotatorPro-StoreSubmission.msix

      # Windows will not sideload-install an unsigned MSIX, so CI signs this
      # copy with a throwaway certificate for local testing. Its subject has
      # to match Identity/Publisher in AppxManifest.xml exactly — which is now
      # the real Store publisher CN, so this sideload build shares identity
      # with the Store app. Installing it alongside an existing Store install
      # will conflict (different signer, same package); uninstall one first.
      - name: Sign a sideload copy with a self-signed certificate
        shell: pwsh
        working-directory: annotateVideo
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=BD1D6788-5A7D-4A7F-9751-817381E6C28C" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Screen Annotator Pro — sideload test cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString "SAPVideoDev!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath dist\dev.pfx -Password $pwd | Out-Null
          # The .cer is what the user has to trust before Windows will install
          Export-Certificate -Cert $cert -FilePath dist\ScreenAnnotatorProVideo.cer | Out-Null
          & "${{ steps.sdk.outputs.signtool }}" sign /fd SHA256 /f dist\dev.pfx `
            /p "SAPVideoDev!" dist\ScreenAnnotatorProVideo.msix
          Remove-Item dist\dev.pfx
          "{0:N0} MB  msix" -f ((Get-Item dist\ScreenAnnotatorProVideo.msix).Length / 1MB)

      - name: Write the install instructions
        shell: pwsh
        working-directory: annotateVideo
        run: |
          @'
          Screen Annotator Pro  (MSIX, sideload build)
          =============================================

          This now shares its package identity with the real Store app (video
          recording is a feature of the one app, not a separate package), so
          it will CONFLICT with an existing Store install on this machine —
          uninstall one before installing the other to test.

          Windows refuses to install an MSIX whose signer it does not trust,
          and this one is signed with a throwaway certificate made by CI, so
          the certificate has to be trusted first. In an ADMIN PowerShell, in
          this folder:

            Import-Certificate -FilePath .\ScreenAnnotatorProVideo.cer `
              -CertStoreLocation Cert:\LocalMachine\TrustedPeople

          Then double-click ScreenAnnotatorProVideo.msix and choose Install
          (or: Add-AppxPackage .\ScreenAnnotatorProVideo.msix).

          To remove everything afterwards:
            Get-AppxPackage *ScreenAnnotatorPro* | Remove-AppxPackage
          and delete the certificate from certlm.msc under Trusted People.

          If you would rather not touch the certificate store at all, use the
          single-file .exe artifact instead — it needs no install and no trust,
          only a SmartScreen "More info -> Run anyway". (Start with Windows and
          the in-app Store rating need the installed package; the .exe falls
          back to the registry and the Store link.)

          Snip & Read uses the text recognition built into Windows, so it
          works here too — no separate OCR build any more.

          SUBMITTING TO THE STORE INSTEAD? Do not upload this file — it is
          signed with the throwaway sideload cert above. Use
          ScreenAnnotatorPro-StoreSubmission.msix from the same build's
          artifacts (unsigned; Partner Center signs it itself).
          '@ | Set-Content dist\INSTALL-MSIX.txt -Encoding UTF8

      - name: Upload the installers
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true      # a full artifact quota must not fail the run
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAnnotatorProVideo-installers
          path: |
            annotateVideo/dist/ScreenAnnotatorProVideo.msix
            annotateVideo/dist/ScreenAnnotatorProVideo.cer
            annotateVideo/dist/INSTALL-MSIX.txt
            annotateVideo/dist/ScreenAnnotatorPro-Setup.msi
            annotateVideo/dist/ScreenAnnotatorPro-StoreSubmission.msix
          retention-days: 5

      # The repo is private, so its releases are too: the unsigned
      # Store-submission package rides along for Partner Center.
      - name: Attach to the release on a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            annotateVideo/dist/ScreenAnnotatorPro-Setup.msi
            annotateVideo/dist/ScreenAnnotatorProVideo.msix
            annotateVideo/dist/ScreenAnnotatorProVideo.cer
            annotateVideo/dist/INSTALL-MSIX.txt
            annotateVideo/dist/ScreenAnnotatorPro-StoreSubmission.msix
